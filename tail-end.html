<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tail End</title>
<meta name="description" content="Combien de temps te reste-t-il vraiment avec ton parent ? Un simulateur inspiré de « The Tail End » de Tim Urban.">
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #1f1d1a; --muted: #6b665f; --line: #e6e1d9;
    --used: #c9c3b9; --left: #f08c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141312; --card: #1d1c1a; --text: #f1eee9; --muted: #a39e96; --line: #2f2d2a;
      --used: #4a4641; --left: #ffa94d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141312; --card: #1d1c1a; --text: #f1eee9; --muted: #a39e96; --line: #2f2d2a;
    --used: #4a4641; --left: #ffa94d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .topbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font: inherit; font-size: 14px; }
  .btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: inherit; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 19px; margin: 0 0 14px; }
  .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 28px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--left); }
  input[type=number] { width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; font-variant-numeric: tabular-nums; }
  .headline { font-size: clamp(20px, 3.6vw, 26px); line-height: 1.4; margin: 0 0 18px; }
  .headline b { color: var(--left); }
  .squares { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; max-width: 460px; margin: 0 auto; }
  .squares div { aspect-ratio: 1; border-radius: 4px; background: var(--used); }
  .squares div.left { background: var(--left); }
  .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--muted); margin: 16px 0 0; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .legend strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .big { text-align: center; margin: 4px 0 14px; }
  .big .v { font-size: 56px; font-weight: 800; color: var(--left); line-height: 1; font-variant-numeric: tabular-nums; }
  .big .l { color: var(--muted); margin-top: 6px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--left); display: block; }
  .note { font-size: 13px; color: var(--muted); margin: 14px 0 0; text-align: center; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<main>
  <div class="topbar" role="group" aria-label="Langue / Language">
    <button class="btn" type="button" data-lang="fr" aria-pressed="true">Français</button>
    <button class="btn" type="button" data-lang="en" aria-pressed="false">English</button>
    <button class="btn" type="button" id="themeBtn" data-i18n="theme"></button>
  </div>
  <h1>The Tail End</h1>
  <p class="sub"><span data-i18n="subtitle"></span>
    <a href="https://waitbutwhy.com/2015/12/the-tail-end.html" target="_blank" rel="noopener">“The Tail End”</a>
    <span data-i18n="subtitle2"></span></p>

  <section class="card">
    <h2 data-i18n="inputsTitle"></h2>
    <div class="grid-inputs" id="inputs"></div>
  </section>

  <section class="card">
    <p class="headline" id="headline"></p>
    <div class="squares" id="squares" role="img"></div>
    <div class="legend" id="legend"></div>
    <p class="note" data-i18n="squaresNote"></p>
  </section>

  <section class="card">
    <div class="big"><div class="v" id="visitsLeft"></div><div class="l" data-i18n="visitsLeft"></div></div>
    <div class="dots" id="dots"></div>
    <p class="note" data-i18n="dotsNote"></p>
  </section>

  <footer data-i18n="footer"></footer>
</main>

<script>
(function () {
  const T = {
    fr: {
      theme: "Thème",
      subtitle: "Combien de temps te reste-t-il vraiment avec ton parent ? Inspiré de",
      subtitle2: "de Tim Urban (Wait But Why).",
      inputsTitle: "Ta situation",
      myAge: "Mon âge", leftHome: "Âge auquel j’ai quitté la maison",
      pAge: "Âge de mon parent", lifeExp: "Il ou elle vivra jusqu’à",
      visits: "Visites par an", days: "Jours par visite",
      headline: (u, l) => `Tu as déjà utilisé <b>${u} %</b> de ton temps avec ton parent. Il t’en reste <b>${l} %</b>.`,
      headlineNone: "Avec ces chiffres, il ne reste plus de temps ensemble.",
      squaresAria: (u, l) => `${u} carrés gris sur 100 déjà utilisés, ${l} carrés orange restants`,
      lgUsed: "Déjà utilisé", lgLeft: "Ce qu’il reste",
      squaresNote: "Un carré = 1 % de tout le temps que vous passerez ensemble dans votre vie.",
      visitsLeft: "visites restantes",
      dotsNote: "Un point = une visite. Ce nombre paraît infini, mais on peut le compter.",
      footer: "Hypothèses : tu vivais chaque jour avec ton parent jusqu’à ton départ ; tes visites passées suivaient le même rythme qu’aujourd’hui. Un modèle approximatif, pas une prédiction.",
      pct: x => x + " %"
    },
    en: {
      theme: "Theme",
      subtitle: "How much time do you really have left with your parent? Inspired by Tim Urban’s",
      subtitle2: "on Wait But Why.",
      inputsTitle: "Your situation",
      myAge: "My age", leftHome: "Age I left home",
      pAge: "My parent’s age", lifeExp: "They will live until",
      visits: "Visits per year", days: "Days per visit",
      headline: (u, l) => `You have already used <b>${u}%</b> of your time with your parent. <b>${l}%</b> is left.`,
      headlineNone: "With these numbers, there is no time together left.",
      squaresAria: (u, l) => `${u} grey squares out of 100 already used, ${l} orange squares left`,
      lgUsed: "Already used", lgLeft: "What’s left",
      squaresNote: "One square = 1% of all the time you will ever spend together.",
      visitsLeft: "visits left",
      dotsNote: "One dot = one visit. The number feels endless, but you can count it.",
      footer: "Assumptions: you lived with your parent every day until you left home; past visits followed the same rhythm as today. A rough model, not a prediction.",
      pct: x => x + "%"
    }
  };

  let lang = "fr"; // French by default
  const t = k => T[lang][k];

  const fields = [
    { id: "myAge", min: 1, max: 90, value: 45 },
    { id: "leftHome", min: 10, max: 40, value: 18 },
    { id: "pAge", min: 30, max: 110, value: 72 },
    { id: "lifeExp", min: 60, max: 110, value: 88 },
    { id: "visits", min: 0, max: 52, value: 3 },
    { id: "days", min: 1, max: 60, value: 4 }
  ];
  const s = {};
  const wrap = document.getElementById("inputs");
  fields.forEach(f => {
    s[f.id] = f.value;
    const el = document.createElement("div");
    el.className = "field";
    el.innerHTML = `<label for="r_${f.id}" data-i18n="${f.id}"></label>
      <div class="row"><input type="range" id="r_${f.id}" min="${f.min}" max="${f.max}" value="${f.value}">
      <input type="number" min="${f.min}" max="${f.max}" value="${f.value}" aria-label="${f.id}"></div>`;
    wrap.appendChild(el);
    const r = el.querySelector("input[type=range]"), n = el.querySelector("input[type=number]");
    r.addEventListener("input", () => { n.value = r.value; s[f.id] = +r.value; render(); });
    n.addEventListener("input", () => {
      let v = +n.value; if (n.value === "" || isNaN(v)) return;
      v = Math.max(f.min, Math.min(f.max, v)); r.value = v; s[f.id] = v; render();
    });
  });

  const fmt = n => Math.round(n).toLocaleString(lang === "fr" ? "fr-FR" : "en-US");
  const dec = n => n.toLocaleString(lang === "fr" ? "fr-FR" : "en-US", { maximumFractionDigits: 1 });

  function render() {
    // Time together, measured in days so childhood and visits can be compared.
    const leftHome = Math.min(s.leftHome, s.myAge);
    const perYear = Math.min(365, s.visits * s.days);
    const yearsLeft = Math.max(0, s.lifeExp - s.pAge);
    const past = leftHome * 365 + (s.myAge - leftHome) * perYear;
    const future = yearsLeft * perYear;
    const total = past + future;
    const leftPct = total ? future / total * 100 : 0;
    const usedPct = 100 - leftPct;
    const visitsLeft = yearsLeft * s.visits;

    // 100 squares: grey = used, orange = left (at least 1 orange if any time is left)
    let leftSq = Math.round(leftPct);
    if (future > 0 && leftSq === 0) leftSq = 1;
    const usedSq = 100 - leftSq;

    document.getElementById("headline").innerHTML = future > 0
      ? t("headline")(dec(usedPct), dec(leftPct)) : t("headlineNone");
    const sq = document.getElementById("squares");
    sq.innerHTML = Array.from({ length: 100 }, (_, i) => `<div${i >= usedSq ? ' class="left"' : ""}></div>`).join("");
    sq.setAttribute("aria-label", t("squaresAria")(usedSq, leftSq));
    document.getElementById("legend").innerHTML =
      `<span style="--c:var(--used)">${t("lgUsed")} · <strong>${t("pct")(dec(usedPct))}</strong></span>` +
      `<span style="--c:var(--left)">${t("lgLeft")} · <strong>${t("pct")(dec(leftPct))}</strong></span>`;

    document.getElementById("visitsLeft").textContent = fmt(visitsLeft);
    document.getElementById("dots").innerHTML = "<i></i>".repeat(Math.min(Math.round(visitsLeft), 2000));
  }

  function applyText() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = t(el.dataset.i18n); if (typeof v === "string") el.textContent = v;
    });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  }

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; applyText(); render();
  }));
  document.getElementById("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });

  applyText(); render();
})();
</script>
</body>
</html>
